[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-practice-07"
version = "0.1.0"
description = "A Chinese branching practice sandbox for Git beginners"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "胡丹露" }]
keywords = ["git", "education", "practice", "open-source", "chinese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = []

[project.scripts]
git-practice = "gitpractice.cli:main"

[tool.setuptools]
packages = ["gitpractice"]
